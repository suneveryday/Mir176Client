name: Client source contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check-privacy.py --history
      - run: python tools/check-privacy.py --ref HEAD
      - run: python tools/check-contract.py
      - run: python -m unittest discover -s tests/privacy -v
      - run: python -m unittest discover -s tests/release-packaging -v
  windows-assembly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated program and resource assembly checks
        shell: powershell
        run: tests/release-packaging/check-client-windows.ps1 -OutputDirectory .build/client-assembly-tests
